[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-business-agent"
version = "0.1.0"
description = "Productised platform for autonomous market entry and stakeholder identification"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Agentic Engineering Ltd" }]
requires-python = ">=3.11"
dependencies = [
    # HTTP + config
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # PDF + output rendering
    "reportlab>=4.1",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    # Airtable (fallback when MCP is unavailable). Listed as optional in
    # [project.optional-dependencies] under ``airtable_substrate`` — not
    # in the default install since the pilot substrate is SQLite.
    # LLM via OpenRouter (OpenAI-compatible API)
    "openai>=1.30",
    # Logging + structured events
    "structlog>=24.1",
]

[project.optional-dependencies]
airtable_substrate = [
    "pyairtable>=2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nba-qa = "scripts.qa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nba_platform*", "verticals*", "customers*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
